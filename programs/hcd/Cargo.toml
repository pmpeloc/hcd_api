[package]
name = "hcd"
version = "0.1.0"
description = "Salua - patient-owned health records on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hcd"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]
# Declared so Anchor's macros don't raise `unexpected cfg` warnings.
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"
